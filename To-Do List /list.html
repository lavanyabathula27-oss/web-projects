<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="list.css">
    <title>to-do</title>
</head>
<body>

    <h1> To-Do List</h1>

</div>
    <p>Total Tasks: <span id = "totalCount"> 0</span></p>

    <script src="list.js"></script>

</body>
</html>
