<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJR College Id</title>
    <link rel ="stylesheet" href="id.css">
</head>
<body>
    <div class ="container"> 
        <div class="card">
            <header class="card-header">
            <img src="logo.png" alt="college logo" height="100px">
            <p> BJR (Autonomous)</p>
            </header>

            <div class="photo-wrap">
                <img class="photo" src="profile.png" alt="profile" height="100px">
            </div>
            <main class="card-body">
                <div class="name-section">
                    <h2 class="student-name">  Lavanya Bathula </h2>
                    <p class="college"> Babu Jagjivan Ram Govt Degree College </p>
                         </div>
                        <hr class="divider">
                        <div class ="details"> 
                            <p><strong> Course :</strong> BCOM (CA) </p>
                            <p> <strong> Birth Date :</strong> 27-08-2006</p>
                        </div>
                        <div class="id-line">
                            <span class="id-label"> ID No : </span>
                            <span class="id-value"> 1070-24-405-123</span>
                        </div>
                        <div class="barcode"> </div>
            </main>
            <footer class="card-footer">
                <p class="footer-text"> Issued by : BJRGDC</p>

            </footer>
        </div>
    </div>
    
</body> 
</html>
