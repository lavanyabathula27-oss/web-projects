<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Second projec</title>
<link rel="stylesheet" href="learn.css"/>

</head>
<body>
    <h1> Job Application Form</h1>
    <hr/>
    <form>
  <label> First Name : </label> 
  <input class="pink" type="text" placeholder="Enter your name"/>
<br/><br/><br/>

<label> Last Name :</label>
<input class="pink" type="text" placeholder="Enter your name"/>   
<br/><br/><br/>

<label> Email :</label>
<input class="pink" type="email" placeholder="Enter your email"/>
<br/><br/><br/>

<label> Phone number :</label>
<input class="pink" type="tel" placeholder="Enter your phone number"/>
<br/><br/>

<label> Address :</label> <br/>
<textarea class="pink" placeholder="Enter your address"></textarea > 
<br/><br/><hr/><br/>

<label> Gender :</label>
<input type="radio" name="gender" value="male"/>
<label>Male</label>
<input class="pink" type="radio" name="gender" value="female"/>
<label>Female</label>
<input  type="radio" name="gender" value="other"/>
<label class>Other</label>
<br/><br/><br/>

<label> Qualification :</label>
<input type="radio" name ="qualification" value="highschool"/>
<label>High School</label>
<input type="radio" name ="qualification" value="bachelor"/>
<label>Bachelor's Degree</label>
<br/><br/><hr/><br/>

<label> Job Role :</label>
<select class="pink">
    <option value="none">Select Job Role</option>
    <option value="Assistant">Assistant</option>
    <option value="Data Entry">Data Entry</option>
    <option value="clerk">Clerk</option>
    <option value="senior Assistant">Senior Assistant</option>
</select>
<br/><br/><br/>

<label> City :</label>
<input  class="pink" type="text" placeholder="Enter your city"/>       
<label> Pin Code :</label>
<input class="pink" type="text" placeholder="Enter your pin code"/>
<br/><br/><hr/><br/>

<label> Date of Birth :</label>
<input class="pink" type="date" />
<br/><br/><br/>

<label> Upload CV :</label>
<input type="file"/>
<br/><br/><br/>

<label> Apply Now</label>
<input type="submit" value="Submit"/>
<hr/>
    </form> 
</body>
</html>
